name: StoxSonar daily

on:
  # GitHub often starts scheduled jobs late (Friday 9 Oct ran 5.5 hours late),
  # so the job is tried four times each weekday evening. The first attempt
  # that finds a new NSE close publishes it; the others do nothing.
  schedule:
    - cron: "17 13 * * 1-5"   # 18:47 IST
    - cron: "47 14 * * 1-5"   # 20:17 IST
    - cron: "17 16 * * 1-5"   # 21:47 IST
    - cron: "47 17 * * 1-5"   # 23:17 IST, last attempt
  workflow_dispatch:
    inputs:
      mode:
        description: "daily, or replay to bootstrap the ledger"
        default: daily

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stoxsonar-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Run
        id: run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: >
          python run_daily.py
          --mode "${{ github.event.inputs.mode || 'daily' }}"
          --site-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          ${{ (github.event.inputs.mode || 'daily') == 'daily' && '--telegram' || '' }}
      # The ledger and page are committed every day, so git history is a public,
      # timestamped record that no signal was added or changed after the fact.
      - name: Commit ledger and page
        if: steps.run.outputs.published == 'true'
        run: |
          git config user.name "stoxsonar-bot"
          git config user.email "stoxsonar-bot@users.noreply.github.com"
          git add ledger site
          git diff --cached --quiet || git commit -m "Signals for ${{ steps.run.outputs.as_of }}"
          git pull --rebase origin main
          git push
      - uses: actions/upload-pages-artifact@v3
        if: steps.run.outputs.published == 'true'
        with:
          path: site
      - uses: actions/deploy-pages@v4
        if: steps.run.outputs.published == 'true'
