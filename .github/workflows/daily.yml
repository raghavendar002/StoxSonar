name: StoxSonar daily

on:
  # GitHub starts scheduled jobs late, often by 6-8 hours, so the job is
  # tried many times. The first attempt that finds a new, finished NSE close
  # publishes it; every other attempt exits in seconds. Morning slots catch up
  # before the 09:15 IST open if every evening attempt was delayed or empty.
  # An external scheduler can also call workflow_dispatch (docs/GUIDE.md).
  schedule:
    - cron: "47 10,11,12,13 * * 1-5"   # 16:17, 17:17, 18:17, 19:17 IST
    - cron: "17 15,17 * * 1-5"         # 20:47, 22:47 IST
    - cron: "17 0,1,2 * * 2-6"         # 05:47, 06:47, 07:47 IST next morning
  workflow_dispatch:
    inputs:
      mode:
        description: "daily; replay to bootstrap the ledger; check to report data freshness; page to redraw the page"
        default: daily

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stoxsonar-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Run
        id: run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: >
          python run_daily.py
          --mode "${{ github.event.inputs.mode || 'daily' }}"
          --site-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          ${{ (github.event.inputs.mode || 'daily') == 'daily' && '--telegram' || '' }}
      # The ledger and page are committed every day, so git history is a public,
      # timestamped record that no signal was added or changed after the fact.
      - name: Commit ledger and page
        if: steps.run.outputs.published == 'true'
        run: |
          git config user.name "stoxsonar-bot"
          git config user.email "stoxsonar-bot@users.noreply.github.com"
          git add ledger site
          git diff --cached --quiet || git commit -m "Signals for ${{ steps.run.outputs.as_of }}"
          git pull --rebase origin main
          git push
      - uses: actions/upload-pages-artifact@v3
        if: steps.run.outputs.published == 'true'
        with:
          path: site
      - uses: actions/deploy-pages@v4
        if: steps.run.outputs.published == 'true'
