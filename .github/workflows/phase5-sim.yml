name: Phase 5 portfolio simulation

# Replays v0.2 on NSE files from 2006, then trades its signals in one Rs 1 lakh
# account day by day with Indian costs (research/simulate.py).
on:
  push:
    branches: [claude/phase5-sim]
    paths: [sonar/**, backtest.py, research/simulate.py, .github/workflows/phase5-sim.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase5-sim
  cancel-in-progress: true

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - uses: actions/cache/restore@v4
        with:
          path: cache/nse_panel.pkl
          key: nse-panel-v2-${{ github.run_id }}
          restore-keys: nse-panel-v2-
      - name: Replay v0.2 on NSE files from 2006
        run: python backtest.py --source nse --start 2006-01-01 --windows 18 --out reports/nse_full
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: cache/nse_panel.pkl
          key: nse-panel-v2-${{ github.run_id }}
      - name: Simulate the account
        run: |
          python research/simulate.py reports/nse_full/backtest_signals.csv.gz cache/nse_panel.pkl > reports/simulate.md
          cat reports/simulate.md
      - name: Commit the report
        run: |
          git config user.name "stoxsonar-bot"
          git config user.email "stoxsonar-bot@users.noreply.github.com"
          git add reports/simulate.md reports/sim/
          git commit --quiet -m "Phase 5 simulation report $(date -u +%F)"
          git push --quiet origin HEAD:claude/phase5-sim
