name: Intraday test (branch only)
on:
  push:
    branches: ["claude/project-thread-u4ujar"]
    paths: ["paper/intraday.py", ".github/workflows/intraday-test.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt anthropic
      - run: python -m pytest -q tests
      - name: Scan + debate (1 per market) + settle on the last session
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INTRA_MAX_DEBATE: "1"
        run: |
          python paper/intraday.py scan --mkt in
          python paper/intraday.py settle --mkt in
          python paper/intraday.py scan --mkt us
          python paper/intraday.py settle --mkt us
          python -m sonar.appfeed
          for f in paper/out/in/*/*.json paper/out/us/*/*.json paper/spend.json; do echo "=== $f"; head -c 3000 $f; echo; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intraday-test
          path: |
            paper
            site/app/feed
