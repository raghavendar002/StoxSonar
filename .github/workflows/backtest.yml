name: StoxSonar backtest

on:
  workflow_dispatch:
    inputs:
      windows:
        description: "Look-back windows in years, space separated"
        default: "10 20 30"

permissions:
  contents: write

concurrency:
  group: stoxsonar-daily
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Backtest (never touches the live ledger)
        run: python backtest.py --windows ${{ github.event.inputs.windows }}
      - name: Commit report
        run: |
          git config user.name "stoxsonar-bot"
          git config user.email "stoxsonar-bot@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || git commit -m "Backtest report $(date -u +%F)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
