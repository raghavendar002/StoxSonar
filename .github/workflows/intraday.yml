name: Intraday paper trading

# Called on time by an external scheduler (cron-job.org -> workflow_dispatch),
# because GitHub's own schedule can start hours late:
#   India scan   09:31 IST Mon-Fri   (market=in, mode=scan)
#   India settle 15:45 IST Mon-Fri   (market=in, mode=settle)
#   US scan      20:16 IST Mon-Fri   (19:16 in US summer time)
#   US settle    02:40 IST Tue-Sat
# GitHub's own schedule below is a backstop for all four steps. A scan that
# starts more than 30 minutes after the open replays the open from the day's
# 5-minute bars as it stood at the checkpoint, and a day that already has
# orders is never scanned twice, so a late or doubled trigger is harmless.
# The missed-run check (watchdog.yml) repairs anything still missing.
on:
  workflow_dispatch:
    inputs:
      market:
        description: "in or us"
        required: true
        default: in
      mode:
        description: "scan or settle"
        required: true
        default: scan
  schedule:
    - cron: "1 4 * * 1-5"      # India scan backstop, 09:31 IST
    - cron: "30 10 * * 1-5"    # India settle backstop, 16:00 IST
    - cron: "46 13 * * 1-5"    # US scan backstop, 09:46 New York in summer time
    - cron: "46 14 * * 1-5"    # US scan backstop, 09:46 New York in winter (the other one finds no session)
    - cron: "15 22 * * 1-5"    # US settle backstop, 03:45 IST

permissions:
  contents: write
  pages: write
  id-token: write

# One queue for every intraday step and the missed-run check, so two triggers
# can never scan the same day at once (and pay for the debates twice).
concurrency:
  group: intraday
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt anthropic
      - name: Run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "1 4 * * 1-5")   M=in; MODE=scan ;;
              "30 10 * * 1-5") M=in; MODE=settle ;;
              "15 22 * * 1-5") M=us; MODE=settle ;;
              *)               M=us; MODE=scan ;;
            esac
          else
            M="${{ github.event.inputs.market }}"; MODE="${{ github.event.inputs.mode }}"
          fi
          echo "M=$M" >> "$GITHUB_ENV"; echo "MODE=$MODE" >> "$GITHUB_ENV"
          if [ "$MODE" = settle ]; then python paper/intraday.py settle --mkt $M || true
          else python paper/intraday.py scan --mkt $M; fi
      - name: Build app feeds
        run: python -m sonar.appfeed
      - name: Commit
        run: |
          git config user.name "stoxsonar-bot"
          git config user.email "stoxsonar-bot@users.noreply.github.com"
          git add paper site/app/feed
          if git diff --cached --quiet; then echo "CHANGED=0" >> "$GITHUB_ENV"; exit 0; fi
          git commit -m "Intraday $M $MODE"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub sometimes can't see the artifact just uploaded ("No artifacts named
      # github-pages"); wait and try once more instead of failing the run.
      - uses: actions/deploy-pages@v4
        id: deploy
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - uses: actions/deploy-pages@v4
        if: steps.deploy.outcome == 'failure'
      # Alert to the StoxSonar app on your own devices: the Judge's calls after a
      # scan, both books' results after a settle. Sent after the deploy so tapping
      # it opens fresh data. Skips quietly until the two secrets exist.
      - name: Push alert to the app
        if: env.CHANGED != '0'      # a run that found the day already done sends nothing twice
        continue-on-error: true
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBS: ${{ secrets.PUSH_SUBS }}
        run: python -m sonar.push intraday --mkt "$M"
