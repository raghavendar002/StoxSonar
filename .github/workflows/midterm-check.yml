name: Mid-term check (no live changes)

# Runs the mid-term books on real prices against a copy of the ledger and
# commits reports/midterm_check.md to the same branch. Nothing live changes:
# no Telegram, no page, the real ledger is only read.
# Triggers when checks/request.txt changes on a claude/ branch, or by hand.
on:
  push:
    branches: ["claude/**"]
    paths: ["checks/request.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: python research/midterm_check.py 2>&1 | tail -n 200
      - run: |
          git config user.name "stoxsonar-bot"
          git config user.email "stoxsonar-bot@users.noreply.github.com"
          git add reports/midterm_check.md
          git diff --cached --quiet || git commit -m "Mid-term check report"
          git checkout -- .
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
