<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StoxSonar</title>
<meta name="theme-color" content="#05080f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StoxSonar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
  <aside class="side" aria-label="Navigation">
    <div class="brand"><span class="brand-mark"></span>StoxSonar</div>
    <div class="segs" id="segs-side"></div>
    <nav id="sidenav"></nav>
    <div class="bottom">Paper trading and logged signals. Not investment advice.</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="r1"><div class="brand"><span class="brand-mark"></span>StoxSonar</div>
        <div class="asof" id="asof"></div>
        <button class="icon-btn" id="refresh" data-act="refresh" aria-label="Refresh"><svg class="ico" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></button></div>
      <div class="r2" id="segs-top"></div>
    </header>
    <main class="content" id="view" aria-live="polite"><div class="card muted">Loading…</div></main>
  </div>
  <aside class="sheet" id="sheet" aria-hidden="true" aria-label="Details">
    <div class="grab"></div><div class="head" id="sheet-head"></div><div class="body" id="sheet-body"></div>
  </aside>
</div>
<div class="scrim" id="scrim"></div>
<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
<script type="module" src="js/main.js"></script>
</body>
</html>
